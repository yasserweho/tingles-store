<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bag — Tingles</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="cart-page">
    <h1>Your bag</h1>
    <div id="rows"></div>
    <div class="summary"><div class="summary-box">
      <div style="display:flex;justify-content:space-between"><span>Subtotal</span><strong id="sub">$0</strong></div>
      <p style="color:var(--muted);font-size:14px">Free shipping over $150. Card payment opens on Stripe.</p>
      <button class="btn" id="checkout" style="width:100%">Checkout with Stripe</button>
      <p id="done" style="display:none"></p>
    </div></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script>
    chrome();
    function render(){
      const items = getCart();
      document.getElementById("rows").innerHTML = items.length ? items.map(i => `
        <div class="cart-row">
          <img src="${img(i.img)}" alt="">
          <div><strong>${i.name}</strong><div style="color:var(--muted)">Size ${i.size}</div>
            <div class="qty"><button data-d="${i.key}">−</button><span>${i.qty}</span><button data-u="${i.key}">+</button></div>
          </div>
          <div>${money(i.price*i.qty)}</div>
        </div>`).join("") : "<p>Your bag is empty. <a href='shop.html'>Continue shopping</a></p>";
      document.getElementById("sub").textContent = money(items.reduce((s,i)=>s+i.price*i.qty,0));
      document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
        const items = getCart().map(x => x.key===b.dataset.d ? {...x, qty:x.qty-1} : x).filter(x => x.qty>0);
        setCart(items); render();
      });
      document.querySelectorAll("[data-u]").forEach(b => b.onclick = () => {
        setCart(getCart().map(x => x.key===b.dataset.u ? {...x, qty:x.qty+1} : x)); render();
      });
    }
    document.getElementById("checkout").onclick = async () => {
      const items = getCart();
      const note = document.getElementById("done");
      if (!items.length) {
        note.style.display = "block";
        note.textContent = "Add something before checkout.";
        return;
      }
      const btn = document.getElementById("checkout");
      btn.disabled = true;
      btn.textContent = "Opening Stripe…";
      note.style.display = "none";
      try {
        const res = await fetch("/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: items.map(i => ({ id: i.id, size: i.size, qty: i.qty })) })
        });
        const data = await res.json();
        if (!res.ok || !data.url) throw new Error(data.error || "Checkout failed");
        location.href = data.url;
      } catch (err) {
        note.style.display = "block";
        note.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Checkout with Stripe";
      }
    };
    if (new URLSearchParams(location.search).get("canceled")) {
      document.getElementById("done").style.display = "block";
      document.getElementById("done").textContent = "Checkout canceled. Your bag is still here.";
    }
    render();
  </script>
</body>
</html>
